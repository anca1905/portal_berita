# ============================================================
# Nginx Rewrite Configuration untuk Portal Berita
# Masukkan aturan ini di aaPanel (URL Rewrite) atau Nginx vhost
# ============================================================

rewrite ^/sitemap\.xml$ /sitemap.php last;
rewrite ^/(rss|feed)\.xml$ /rss.php last;
rewrite ^/berita/([a-zA-Z0-9_-]+)/?$ /berita.php?slug=$1 last;
rewrite ^/kategori/([a-zA-Z0-9_-]+)/halaman-([0-9]+)/?$ /kategori.php?slug=$1&page=$2 last;
rewrite ^/kategori/([a-zA-Z0-9_-]+)/?$ /kategori.php?slug=$1 last;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}
